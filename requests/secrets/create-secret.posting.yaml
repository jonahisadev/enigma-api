name: Create Secret
method: POST
url: ${API_HOST}/vaults/$vault_id/secrets
body:
  content: |-
    {
      "name": "my-secret",
      "value": "foobar"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $bearer_token
headers:
- name: content-type
  value: application/json
scripts:
  on_response: util.py:create_secret
