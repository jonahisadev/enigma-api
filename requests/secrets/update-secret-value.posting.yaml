name: Update Secret Value
method: PUT
url: ${API_HOST}/vaults/$vault_id/secrets/$secret_id
body:
  content: |-
    {
      "value": "updated value"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $bearer_token
headers:
- name: content-type
  value: application/json
