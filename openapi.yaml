openapi: 3.0.3
info:
  title: Enigma Secrets Management API
  description: API for securely storing and managing encryption keys and secrets
    across multiple vaults with KMS integration support
  version: 0.2.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login endpoints
  schemas: {}
paths:
  /:
    get:
      responses:
        "200":
          description: Default Response
  /health:
    get:
      responses:
        "200":
          description: Default Response
  /accounts/login:
    post:
      tags:
        - Authentication
      description: Authenticate with email and password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: User's email address
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  description: User's password
                  type: string
                  minLength: 1
              required:
                - email
                - password
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    description: JWT access token (expires in 15 minutes)
                    type: string
                  refreshToken:
                    description: Refresh token (expires in 30 days)
                    type: string
                  user:
                    description: User information
                    type: object
                    properties:
                      publicId:
                        description: User public ID
                        type: string
                      name:
                        description: User name
                        type: string
                      email:
                        description: User email
                        type: string
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    required:
                      - publicId
                      - name
                      - email
                    additionalProperties: false
                required:
                  - accessToken
                  - refreshToken
                  - user
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /accounts/login/refresh:
    post:
      tags:
        - Authentication
      description: Refresh access token using a refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  description: Refresh token obtained from login
                  type: string
                  minLength: 1
              required:
                - refreshToken
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    description: New JWT access token
                    type: string
                  refreshToken:
                    description: New refresh token
                    type: string
                  user:
                    description: User information
                    type: object
                    properties:
                      publicId:
                        description: User public ID
                        type: string
                      name:
                        description: User name
                        type: string
                      email:
                        description: User email
                        type: string
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    required:
                      - publicId
                      - name
                      - email
                    additionalProperties: false
                required:
                  - accessToken
                  - refreshToken
                  - user
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /accounts/login/revoke:
    post:
      tags:
        - Authentication
      description: Revoke one or all refresh tokens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  description: Specific refresh token to revoke (omit to revoke all)
                  type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Success message
                    type: string
                required:
                  - message
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /vaults:
    post:
      tags:
        - Vaults
      description: Create a new vault
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Vault name
                  type: string
                  minLength: 1
              required:
                - name
        required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Vault public ID
                    type: string
                  name:
                    description: Vault name
                    type: string
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    get:
      tags:
        - Vaults
      description: List all vaults accessible to the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaults:
                    type: array
                    items:
                      type: object
                      properties:
                        publicId:
                          description: Vault public ID
                          type: string
                        name:
                          description: Vault name
                          type: string
                        createdAt:
                          description: Creation timestamp
                          type: string
                          format: date-time
                        updatedAt:
                          description: Last update timestamp
                          type: string
                          format: date-time
                      required:
                        - publicId
                        - name
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - vaults
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /vaults/{id}:
    get:
      tags:
        - Vaults
      description: Get a specific vault by ID
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: Vault public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Vault public ID
                    type: string
                  name:
                    description: Vault name
                    type: string
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    put:
      tags:
        - Vaults
      description: Update vault name
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New vault name
                  type: string
                  minLength: 1
              required:
                - name
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: Vault public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Vault public ID
                    type: string
                  name:
                    description: Vault name
                    type: string
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    delete:
      tags:
        - Vaults
      description: Delete a vault and all its secrets (requires password authentication)
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: Vault public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /vaults/{vaultId}/secrets:
    post:
      tags:
        - Secrets
      description: Create a new secret in a vault
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Secret name (unique per vault)
                  type: string
                  minLength: 1
                value:
                  description: Secret value (will be encrypted)
                  type: string
                  minLength: 1
              required:
                - name
                - value
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: vaultId
          required: true
          description: Vault public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Secret public ID
                    type: string
                  name:
                    description: Secret name
                    type: string
                  version:
                    description: Secret version number
                    type: number
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - version
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    get:
      tags:
        - Secrets
      description: List all secrets in a vault (optionally filter by name or get
        latest versions only)
      parameters:
        - schema:
            type: string
          in: query
          name: name
          required: false
          description: Filter by secret name
        - schema:
            type: boolean
          in: query
          name: latest
          required: false
          description: Only return latest version of each secret
        - schema:
            type: string
          in: path
          name: vaultId
          required: true
          description: Vault public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        publicId:
                          description: Secret public ID
                          type: string
                        name:
                          description: Secret name
                          type: string
                        version:
                          description: Secret version number
                          type: number
                        createdAt:
                          description: Creation timestamp
                          type: string
                          format: date-time
                        updatedAt:
                          description: Last update timestamp
                          type: string
                          format: date-time
                      required:
                        - publicId
                        - name
                        - version
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - secrets
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    delete:
      tags:
        - Secrets
      description: Delete all versions of a secret by name
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
          name: name
          required: true
          description: Secret name to delete (all versions)
        - schema:
            type: string
          in: path
          name: vaultId
          required: true
          description: Vault public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deletedCount:
                    type: number
                required:
                  - message
                  - deletedCount
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /vaults/{vaultId}/secrets/{secretId}:
    get:
      tags:
        - Secrets
      description: Get a specific secret by ID (decrypted)
      parameters:
        - schema:
            type: string
          in: path
          name: vaultId
          required: true
          description: Vault public ID
        - schema:
            type: string
          in: path
          name: secretId
          required: true
          description: Secret public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Secret public ID
                    type: string
                  name:
                    description: Secret name
                    type: string
                  value:
                    description: Decrypted secret value (only in get by ID)
                    type: string
                  version:
                    description: Secret version number
                    type: number
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - version
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    put:
      tags:
        - Secrets
      description: Update a secret value (creates a new version)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  description: New secret value (creates new version)
                  type: string
                  minLength: 1
              required:
                - value
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: vaultId
          required: true
          description: Vault public ID
        - schema:
            type: string
          in: path
          name: secretId
          required: true
          description: Secret public ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Secret public ID
                    type: string
                  name:
                    description: Secret name
                    type: string
                  version:
                    description: Secret version number
                    type: number
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - version
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
  /roles:
    post:
      tags:
        - Roles
      description: Create a new role for delegated access
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Role name
                  type: string
                  minLength: 1
                description:
                  description: Role description
                  type: string
              required:
                - name
        required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicId:
                    description: Role public ID
                    type: string
                  name:
                    description: Role name
                    type: string
                  description:
                    description: Role description
                    type: string
                  createdAt:
                    description: Creation timestamp
                    type: string
                    format: date-time
                  updatedAt:
                    description: Last update timestamp
                    type: string
                    format: date-time
                required:
                  - publicId
                  - name
                  - createdAt
                  - updatedAt
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    description: Error description
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
    get:
      tags:
        - Roles
      description: List all roles for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
